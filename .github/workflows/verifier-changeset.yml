name: Vérifier le changeset

# Chaque branche qui touche à l'add-on doit dire ce qu'elle change, dans les
# mots d'un parent qui lit la page de mise à jour de Home Assistant. Sans ce
# garde-fou, la règle se perd dès la première branche pressée — et le journal
# des versions se vide.
#
# Pour un changement sans effet visible (CI, dépendances internes, refactor),
# la porte de sortie prévue est un changeset vide: `npx changeset add --empty`.

on:
  pull_request:
    paths:
      - "taches-et-points/**"

jobs:
  changeset:
    name: Un changeset accompagne la branche
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          # Il faut l'historique pour comparer la branche à sa cible.
          fetch-depth: 0

      - name: Chercher un changeset ajouté
        run: |
          set -euo pipefail

          base="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"

          # Uniquement les fichiers AJOUTÉS: modifier le README du dossier
          # .changeset ne doit pas compter comme une description de changement.
          added="$(git diff --name-only --diff-filter=A "$base...HEAD" \
            -- 'taches-et-points/.changeset/*.md' \
            | grep -v '/README\.md$' || true)"

          if [ -n "$added" ]; then
            echo "Changeset trouvé:"
            echo "$added" | sed 's/^/  - /'
            exit 0
          fi

          cat >&2 <<'MESSAGE'
          Aucun changeset dans cette branche.

          Décrivez le changement pour la personne qui lira la page de mise à
          jour de l'add-on dans Home Assistant:

              cd taches-et-points
              npx changeset

          puis committez le fichier créé dans .changeset/.

          Si le changement n'a aucun effet visible (CI, refactor, dépendances):

              npx changeset add --empty
          MESSAGE
          exit 1
