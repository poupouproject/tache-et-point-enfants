name: Publier

# Sur main, après chaque fusion: publie ce qui est écrit. Ne décide rien.
#
# La version de config.yaml fait foi. Si elle n'est pas encore sur GHCR:
# images (testées avant d'être poussées), tag vX.Y.Z et release GitHub avec la
# section correspondante de CHANGELOG.md. Si elle y est déjà (une PR de CI
# avec un changeset vide), rien n'est publié. Peut être relancé à la main sans
# risque: ce qui existe déjà n'est jamais refait.
#
# Libère ensuite le verrou « publication-en-cours » et relance la PR suivante
# en file (voir pret-a-publier.yml).
#
# Le Supervisor télécharge l'image au lieu de la construire (clé `image:` de
# config.yaml). Chaque architecture est construite sur un runner de la même
# architecture: émuler l'ARM en QEMU multiplierait la durée par cinq ou plus.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publier
  cancel-in-progress: false

jobs:
  image:
    name: Image ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/image
        with:
          arch: ${{ matrix.arch }}
          publier: "true"
          token: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release GitHub
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Tag et release
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p' taches-et-points/config.yaml)"
          tag="v$version"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "La release $tag existe déjà."
            exit 0
          fi

          # La section « ## X.Y.Z » du journal, jusqu'à la suivante: c'est ce
          # que les parents lisent aussi dans Home Assistant.
          awk -v v="$version" '
            $0 == "## " v { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' taches-et-points/CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Version $version." > notes.md

          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Quêtes & Pièces $version" --notes-file notes.md
          echo "Release $tag créée."

  verrou:
    name: Libérer le verrou
    needs: [image, release]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      READY: ready
      LOCK: publication-en-cours
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - run: |
          set -euo pipefail
          # La PR qui tenait le verrou vient d'être fusionnée: on le retire.
          for pr in $(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --label "$LOCK" --json number --jq '.[].number'); do
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --remove-label "$LOCK" --remove-label "$READY" || true
            echo "Verrou de la PR #$pr libéré."
          done
          bash .github/scripts/suivante.sh
