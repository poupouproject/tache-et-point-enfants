---
name: Quêtes & Pièces
version: "1.0.2"
slug: taches-et-points
description: >-
  Tâches et points pour les enfants, avec récompenses et conversion en argent
url: https://github.com/poupouproject/tache-et-point-enfants
arch:
  - amd64
  - aarch64

# Avec cette clé, le Supervisor TÉLÉCHARGE l'image au lieu de la construire:
# compiler Next.js sur le matériel Home Assistant prendrait de longues minutes.
# `{arch}` est remplacé par le Supervisor, et le tag utilisé est le `version:`
# ci-dessus — il faut donc l'incrémenter pour publier une mise à jour.
# Les images sont produites par .github/workflows/publier-addon.yml.
image: ghcr.io/poupouproject/taches-et-points-{arch}
# L'image n'embarque pas d'init (pas de s6): on laisse Docker en fournir un,
# pour que les signaux d'arrêt atteignent Node et que rien ne devienne zombie.
init: true

# Volontairement PAS d'ingress: l'app doit être joignable directement par URL
# sur le réseau local (http://<ip-ha>:3000), sans passer par une session Home
# Assistant ni apparaître dans la barre latérale. C'est le NIP de l'app qui
# protège l'accès.
ingress: false
# Bouton « Ouvrir l'interface web » sur la page de l'add-on: le Supervisor
# remplace [HOST] par l'adresse de Home Assistant et [PORT:3000] par le port
# réellement publié, même si un parent l'a changé dans la configuration.
webui: http://[HOST]:[PORT:3000]/
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: Interface web (NIP requis)

# /data est fourni par le Supervisor: persistant entre les redémarrages et les
# mises à jour, et inclus dans les sauvegardes Home Assistant. C'est là que vit
# la base SQLite.
map:
  - data:rw

options:
  timezone: America/Toronto
schema:
  timezone: str
